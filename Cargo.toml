[package]
name = "woomer"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
grim-rs = { version = "0.1.6", default-features = false, features = ["png_support"] }
hyprland = { version = "0.4.0-beta.3", default-features = false, features = ["data"] }
raylib = { version = "5.5.1", features = ["wayland", "opengl_33"] }

[features]
dev = []
